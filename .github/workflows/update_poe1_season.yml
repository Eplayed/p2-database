name: Update POE1 Season Data

on:
  # 定时执行已关闭（2026-09-08）：日常数据刷新由本地 dashboard 定时任务负责。
  # 此处仅保留手动触发作为应急备用。
  workflow_dispatch:

concurrency:
  group: poe1-season-data
  cancel-in-progress: false

jobs:
  update-poe1-season-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Refresh POE1 ladder and economy
        env:
          NODE_ENV: production
        run: npm run poe1:ladder && npm run poe1:economy

      - name: Preserve passive tree screenshot refs
        # 云端重新生成的 digest 不含天赋截图；从 OSS 现有版本回填引用，避免覆盖本地截图
        env:
          NODE_ENV: production
        run: node scripts/poe1_preserve_tree_refs.js

      - name: Upload POE1 data to OSS
        env:
          NODE_ENV: production
          OSS_REGION: oss-cn-hangzhou
          OSS_BUCKET: poe2-all-class
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: node scripts/upload_poe1_to_oss.js
